services:

  db:
    image: postgres:16
    container_name: secure_postgres

    environment:
      POSTGRES_DB: secure_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build: .

    container_name: secure_backend

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:admin@db:5432/secure_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    ports:
      - "8000:8000"

    volumes:
      - ./app/uploads:/app/app/uploads
      - ./logs:/app/logs


volumes:
  postgres_data: